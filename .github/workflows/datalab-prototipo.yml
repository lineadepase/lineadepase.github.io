name: Pruebas de DataLab
on:
  push:
    branches: [desarrollo/linea-de-pase-2]
    paths:
      - 'datalab-prototipo/**'
      - 'assets/linea2*'
      - 'herramientas/linea2*.py'
      - 'herramientas/pruebas/test_linea2.py'
      - 'datos/zaragoza.json'
      - 'datos/linea2-catalogo.json'
      - 'assets/archivo-visual.js'
      - 'assets/archivo-visual.css'
      - 'assets/experiencia.js'
      - 'assets/mejoras.js'
      - 'assets/pasaporte-cifra.css'
      - 'videos/index.html'
      - 'herramientas/actualizar_exploracion.py'
      - 'herramientas/auditar_canonicos.py'
      - 'archivo-visual/index.html'
      - 'herramientas/actualizar_seo.py'
      - '.github/workflows/datalab-prototipo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'datalab-prototipo/**'
      - 'assets/linea2*'
      - 'herramientas/linea2*.py'
      - 'herramientas/pruebas/test_linea2.py'
      - 'datos/zaragoza.json'
      - 'datos/linea2-catalogo.json'
      - 'assets/archivo-visual.js'
      - 'assets/archivo-visual.css'
      - 'assets/experiencia.js'
      - 'assets/mejoras.js'
      - 'assets/pasaporte-cifra.css'
      - 'videos/index.html'
      - 'herramientas/actualizar_exploracion.py'
      - 'herramientas/auditar_canonicos.py'
      - 'archivo-visual/index.html'
      - 'herramientas/actualizar_seo.py'
      - '.github/workflows/datalab-prototipo.yml'
permissions:
  contents: read
jobs:
  probabilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test datalab-prototipo/pruebas/*.test.cjs
      - run: python herramientas/linea2.py
      - run: git diff --exit-code -- datalab-prototipo assets/linea2.js assets/linea2-experiencias.js assets/linea2-cuaderno.js
      - run: python herramientas/auditar_enlaces.py
      - run: python -m unittest discover -s herramientas/pruebas -p test_linea2.py
      - run: python herramientas/linea2_datos.py
  navegador:
    needs: probabilidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        motor: [chromium, firefox, webkit]
    env:
      LDP_ENGINE: ${{ matrix.motor }}
    defaults:
      run:
        working-directory: datalab-prototipo/pruebas/navegador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: datalab-prototipo/pruebas/navegador/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r ../../../herramientas/requirements-web.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ubicar candidata independiente
        run: echo "LDP_CANDIDATE_DIR=$RUNNER_TEMP/linea2-candidata" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps ${{ matrix.motor }}
      - run: python herramientas/linea2_candidata.py --destino "$LDP_CANDIDATE_DIR"
        working-directory: ${{ github.workspace }}
      - run: python "$LDP_CANDIDATE_DIR/herramientas/auditar_canonicos.py"
      - run: python "$LDP_CANDIDATE_DIR/herramientas/auditar_enlaces.py"
      - run: npm test
      - name: Conservar informe y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-navegador-${{ matrix.motor }}-${{ github.sha }}
          path: |
            datalab-prototipo/pruebas/navegador/playwright-report/
            datalab-prototipo/pruebas/navegador/test-results/
          retention-days: 14
