name: Pruebas de DataLab
on:
  push:
    branches: [desarrollo/linea-de-pase-2]
    paths:
      - 'datalab-prototipo/**'
      - 'assets/linea2.*'
      - 'herramientas/linea2.py'
      - 'herramientas/pruebas/test_linea2.py'
      - 'datos/zaragoza.json'
      - '.github/workflows/datalab-prototipo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'datalab-prototipo/**'
      - 'assets/linea2.*'
      - 'herramientas/linea2.py'
      - 'herramientas/pruebas/test_linea2.py'
      - 'datos/zaragoza.json'
      - '.github/workflows/datalab-prototipo.yml'
permissions:
  contents: read
jobs:
  probabilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test datalab-prototipo/pruebas/probabilidad.test.cjs
      - run: python herramientas/linea2.py
      - run: git diff --exit-code -- datalab-prototipo/index.html
      - run: python herramientas/auditar_enlaces.py
      - run: python -m unittest discover -s herramientas/pruebas -p test_linea2.py
